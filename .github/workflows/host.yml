name: host

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: host · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node e2e/host.mjs
      - if: runner.os == 'Linux'
        run: npm run typecheck
